<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BREACH</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050508;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    /* ── Name ── */
    .name {
      color: #ffffff22;
      font-size: 11px;
      letter-spacing: 8px;
      text-transform: uppercase;
      margin-bottom: 48px;
    }

    /* ── Orb container ── */
    .orb-wrap {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Outer ring ── */
    .ring {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 1px solid #ffffff11;
      animation: ring-spin 8s linear infinite;
    }

    .ring::before {
      content: '';
      position: absolute;
      top: -2px; left: 40%;
      width: 6px; height: 6px;
      background: #4fc3f7;
      border-radius: 50%;
      box-shadow: 0 0 8px #4fc3f7;
    }

    @keyframes ring-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ── Core orb ── */
    .orb {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #1a1a2e, #050508);
      box-shadow:
        0 0 30px #4fc3f720,
        0 0 60px #4fc3f710,
        inset 0 0 30px #4fc3f705;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    /* ── Orb inner shine ── */
    .orb::before {
      content: '';
      position: absolute;
      top: 15%; left: 20%;
      width: 30%; height: 20%;
      background: #ffffff08;
      border-radius: 50%;
      filter: blur(4px);
    }

    /* ── Wave bars (shown when speaking) ── */
    .waves {
      position: absolute;
      bottom: 30%;
      display: flex;
      gap: 4px;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .wave-bar {
      width: 3px;
      background: #4fc3f7;
      border-radius: 2px;
      animation: wave 0.8s ease-in-out infinite;
    }

    .wave-bar:nth-child(1) { height: 8px;  animation-delay: 0.0s; }
    .wave-bar:nth-child(2) { height: 16px; animation-delay: 0.1s; }
    .wave-bar:nth-child(3) { height: 24px; animation-delay: 0.2s; }
    .wave-bar:nth-child(4) { height: 16px; animation-delay: 0.3s; }
    .wave-bar:nth-child(5) { height: 8px;  animation-delay: 0.4s; }

    @keyframes wave {
      0%, 100% { transform: scaleY(1);   }
      50%       { transform: scaleY(1.8); }
    }

    /* ── Status text ── */
    .status {
      margin-top: 48px;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #4fc3f760;
      transition: all 0.4s ease;
      min-height: 20px;
    }

    /* ── State: idle ── */
    body.idle .orb {
      box-shadow:
        0 0 20px #4fc3f715,
        0 0 40px #4fc3f708,
        inset 0 0 20px #4fc3f703;
    }

    /* ── State: listening ── */
    body.listening .orb {
      box-shadow:
        0 0 50px #4fc3f750,
        0 0 100px #4fc3f730,
        inset 0 0 40px #4fc3f715;
      animation: pulse 1.2s ease-in-out infinite;
    }

    body.listening .status { color: #4fc3f7cc; }

    @keyframes pulse {
      0%, 100% { transform: scale(1);    }
      50%       { transform: scale(1.06); }
    }

    /* ── State: thinking ── */
    body.thinking .orb {
      box-shadow:
        0 0 40px #7c4dff50,
        0 0 80px #7c4dff30,
        inset 0 0 30px #7c4dff15;
      background: radial-gradient(circle at 35% 35%, #1a0a2e, #050508);
      animation: think-spin 2s linear infinite;
    }

    body.thinking .status { color: #7c4dffcc; }

    @keyframes think-spin {
      from { box-shadow: 0 0 40px #7c4dff50, 0 0 80px #7c4dff30, inset 0 0 30px #7c4dff15; }
      50%  { box-shadow: 0 0 60px #7c4dff80, 0 0 100px #7c4dff50, inset 0 0 40px #7c4dff25; }
      to   { box-shadow: 0 0 40px #7c4dff50, 0 0 80px #7c4dff30, inset 0 0 30px #7c4dff15; }
    }

    /* ── State: speaking ── */
    body.speaking .orb {
      box-shadow:
        0 0 50px #00e5ff50,
        0 0 100px #00e5ff30,
        inset 0 0 40px #00e5ff15;
      background: radial-gradient(circle at 35% 35%, #001a20, #050508);
    }

    body.speaking .waves  { opacity: 1; }
    body.speaking .status { color: #00e5ffcc; }
  </style>
</head>
<body class="idle">

  <div class="name">B R E A C H</div>

  <div class="orb-wrap">
    <div class="ring"></div>
    <div class="orb">
      <div class="waves">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
    </div>
  </div>

  <div class="status" id="status-text">STANDBY</div>

  <script>
    const statusText = {
      idle:      "STANDBY",
      listening: "LISTENING",
      thinking:  "THINKING",
      speaking:  "SPEAKING"
    };

    let currentState = "idle";

    function applyState(state) {
      if (state === currentState) return;
      currentState = state;
      document.body.className = state;
      document.getElementById("status-text").textContent = statusText[state] || "STANDBY";
    }

    // Poll BREACH brain every 300ms for state changes
    async function pollState() {
      try {
        const res  = await fetch("/state");
        const data = await res.json();
        applyState(data.state);
      } catch (e) {
        // server not ready yet, keep trying
      }
    }

    setInterval(pollState, 300);
  </script>
</body>
</html>
